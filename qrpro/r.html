<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QR Pro — redirecting</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">
  <div class="center" id="loading">
    <div class="spin"></div>
    <p class="muted">Taking you there…</p>
  </div>
  <div class="center" id="notfound" hidden>
    <div style="font-size:44px;margin-bottom:12px">🔍</div>
    <h1>QR code not found</h1>
    <p class="muted" style="max-width:420px;margin:0 auto">This QR code doesn't exist or was deleted by its owner. Please check with the shop that printed it.</p>
  </div>
</div>
<script src="app.js"></script>
<script src="r.js"></script>
</body>
</html>
