<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuitionOS — Teacher Dashboard</title>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap">

  <!-- passcode gate -->
  <div class="lock" id="lock">
    <div class="card">
      <h2>TuitionOS</h2>
      <p>Teacher dashboard — enter passcode</p>
      <div class="field"><input id="pass" type="password" inputmode="numeric" placeholder="Passcode" autocomplete="off"></div>
      <button class="btn block" id="btnUnlock">Unlock</button>
      <div class="err" id="passErr"></div>
    </div>
  </div>

  <!-- dashboard -->
  <div id="dash" hidden>
    <div class="topbar">
      <div class="row">
        <div>
          <h1 id="bizName">TuitionOS</h1>
          <p id="bizSub">Teacher dashboard</p>
        </div>
        <button class="btn sm ghost" id="btnSettingsTop" style="background:rgba(255,255,255,.15);border-color:rgba(255,255,255,.4);color:#fff">⚙</button>
      </div>
    </div>

    <div class="stats">
      <div class="stat"><div class="v" id="stCollected">₹0</div><div class="l">Fees collected this month</div></div>
      <div class="stat"><div class="v" id="stPending">₹0</div><div class="l">Fees pending this month</div></div>
      <div class="stat"><div class="v" id="stAttend">—</div><div class="l">Attendance today</div></div>
      <div class="stat"><div class="v" id="stStudents">0</div><div class="l">Students</div></div>
    </div>

    <div class="tabs" id="tabs">
      <button class="tab on" data-tab="students">Students</button>
      <button class="tab" data-tab="attend">Attendance</button>
      <button class="tab" data-tab="fees">Fees</button>
      <button class="tab" data-tab="scores">Scores</button>
      <button class="tab" data-tab="settings">Settings</button>
    </div>

    <div id="pane-students"></div>
    <div id="pane-attend" hidden></div>
    <div id="pane-fees" hidden></div>
    <div id="pane-scores" hidden></div>
    <div id="pane-settings" hidden></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="admin.js"></script>
</body>
</html>
