<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Preview</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#fff;color:#14231b}
  [hidden]{display:none!important}
  .pv-head{padding:26px 20px 18px;text-align:center;border-bottom:1px solid #eef2ef}
  .pv-logo{width:64px;height:64px;border-radius:16px;object-fit:cover;margin:0 auto 10px;display:block}
  .pv-name{font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
  .pv-tag{font-size:.85rem;color:#5a6b60;margin-top:3px}
  .pv-welcome{padding:16px 20px;font-size:.92rem;color:#3c4a42;background:#f7faf8;border-bottom:1px solid #eef2ef}
  .pv-body{padding:18px 20px 30px}
  .pv-field{margin-bottom:12px}
  .pv-field label{display:block;font-size:.78rem;font-weight:600;margin-bottom:5px;color:#5a6b60}
  .pv-field input,.pv-field select{width:100%;padding:11px 13px;border:1.5px solid #dfe7e1;border-radius:10px;font-size:1rem;font-family:inherit}
  .pv-btn{width:100%;padding:13px;border:none;border-radius:12px;color:#fff;font-weight:700;font-size:1rem;cursor:pointer;font-family:inherit}
  .pv-sec{font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#5a6b60;margin:20px 0 10px}
  .pv-item{border:1px solid #e6efe9;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
  .pv-item .t{font-weight:700}
  .pv-item .s{font-size:.8rem;color:#5a6b60}
  .chip{font-size:.72rem;font-weight:700;padding:4px 10px;border-radius:20px;white-space:nowrap}
  .chip.waiting,.chip.booked,.chip.pending{background:#fef3c7;color:#8a5a00}
  .chip.serving,.chip.preparing{background:#dbeafe;color:#1d4ed8}
  .chip.done,.chip.confirmed,.chip.ready{background:#d1fae5;color:#065f46}
  .chip.cancelled{background:#fee2e2;color:#b3261e}
  .pv-empty{text-align:center;color:#8aa096;font-size:.88rem;padding:22px 0}
  .pv-foot{text-align:center;font-size:.72rem;color:#a9b8ae;padding:18px}
</style>
</head>
<body>
<div id="app"></div>
<script src="preview.js"></script>
</body>
</html>
